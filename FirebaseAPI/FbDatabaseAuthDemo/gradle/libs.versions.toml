[versions]
agp = "9.4.1"
google-services = "4.5.0"
appcompat = "1.8.0"
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
cardview = "1.0.0"
material = "1.14.0"
firebase-bom = "34.19.0"
firebaseui = "9.1.1"
credentials = "1.6.0"
googleid = "1.2.1"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
material = { module = "com.google.android.material:material", version.ref = "material" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
play-services-auth = { module = "com.google.android.gms:play-services-auth" }
firebase-database = { module = "com.google.firebase:firebase-database" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-storage = { module = "com.google.firebase:firebase-storage" }
firebase-config = { module = "com.google.firebase:firebase-config" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
firebaseui-database = { module = "com.firebaseui:firebase-ui-database", version.ref = "firebaseui" }
firebaseui-auth = { module = "com.firebaseui:firebase-ui-auth", version.ref = "firebaseui" }
firebaseui-storage = { module = "com.firebaseui:firebase-ui-storage", version.ref = "firebaseui" }
firebaseui-firestore = { module = "com.firebaseui:firebase-ui-firestore", version.ref = "firebaseui" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }