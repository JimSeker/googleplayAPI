apply plugin: 'com.android.application'

android {
    compileSdk = 37

    defaultConfig {
        applicationId = "edu.cs4730.actmapdemo"
        minSdk = 32
        targetSdk = 37
        versionCode = 1
        versionName = "1.0"
        multiDexEnabled = true
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    namespace = 'edu.cs4730.actmapdemo'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation("androidx.activity:activity:1.13.0")
    // Dependency for Google location aware stuff.
    //see https://developers.google.com/android/guides/setup for the whole list.
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-base:18.11.0'
    //viewmodel
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.11.0"
    implementation "androidx.lifecycle:lifecycle-livedata:2.11.0"
}
